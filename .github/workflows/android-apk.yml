name: Build Local Basket Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.js'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Android app
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: local-basket-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare public APK filename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Local-Basket.apk
      - name: Publish public APK download on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Local Basket Android App (Latest)
          body: |
            Free Android APK for Local Basket.
            
            Download Local-Basket.apk below, install it on an Android phone, and allow installation from your browser/files app if prompted.
            
            This is a debug APK for testing. Payment verification is manual; do not treat a customer click or screenshot as verified payment.
          files: Local-Basket.apk
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
